name: Bug report
description: Something in the code, the checks or the documents is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If one of the verification commands gave you a result that differs from the published one, use the replication report form: it asks for the things we need to compare.
        Do not paste keys or tokens. Security problems go through the route in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or opened, what you expected and what you got. Paste the full error output.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands from a clean clone, if you can.
      render: sh
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or tag
      description: Output of `git rev-parse --short HEAD`, or the release tag
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Analysis and numbers
        - Ledger and assignment verification
        - Harness and runner
        - Flagsmith setup scripts
        - Kit (Python or TypeScript)
        - Board and site
        - Documents (README, paper, deck)
        - CI and release
        - Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Operating system, and the output of `uv --version` and `uv run python --version`
      render: text
