# Manual only. Runs the kit end to end against the Flagsmith sandbox environment.
# With estimate_only unchecked it makes real model calls on a couple of tasks, which
# spends a few cents of Anthropic credit per run; it never runs on push or PR.
#
# Secrets: FLAGSMITH_SANDBOX_ENV_KEY (server-side key of the sandbox environment),
# ANTHROPIC_API_KEY. Admin API access comes from GitHub OIDC through
# Flagsmith/setup-cli, so no Flagsmith admin key is stored; the Flagsmith project needs
# a trust relationship for this repository (see the Flagsmith CLI docs).
name: kit demo

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Number of tasks to run
        type: number
        default: 2
      estimate_only:
        description: Print the cost estimate and stop (no model calls)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: kit-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: flagsmith-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.9"
          enable-cache: true
      - uses: Flagsmith/setup-cli@c7154aaa37dff8aca0b66afc1e6722e7ad00c115 # v1.0.0
        with:
          cli-version: v2.0.0
      - name: uv sync
        run: uv sync --locked
      - name: flagsmith flag list (sandbox)
        env:
          FLAGSMITH_ENVIRONMENT_KEY: ${{ secrets.FLAGSMITH_SANDBOX_ENV_KEY }}
        run: flagsmith flag list
      - name: cost estimate
        env:
          FLAGSMITH_ENVIRONMENT_KEY: ${{ secrets.FLAGSMITH_SANDBOX_ENV_KEY }}
          TASKS: ${{ inputs.tasks }}
        run: uv run forkbill demo --tasks "$TASKS" --dry-run-cost
      - name: demo run (spends a few cents)
        if: ${{ !inputs.estimate_only }}
        env:
          FLAGSMITH_ENVIRONMENT_KEY: ${{ secrets.FLAGSMITH_SANDBOX_ENV_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASKS: ${{ inputs.tasks }}
        run: uv run forkbill demo --tasks "$TASKS"
