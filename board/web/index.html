    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ECEAE3" />

    <!--head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      document.documentElement.classList.add("js");
      // Lets the hero hold its first frame until the load animation starts; cleared by script or
      // after 2.5 s if the bundle never runs, so content is never hidden for long.
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("js-intro");
        setTimeout(function () { document.documentElement.classList.remove("js-intro"); }, 2500);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
