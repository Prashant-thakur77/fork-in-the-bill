name = "fork-in-the-bill-board"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Comma-separated origins allowed to read /state and /stream.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"

# Create with `wrangler d1 create board` and paste the returned id here.
[[d1_databases]]
binding = "DB"
database_name = "board"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secret (not in this file): wrangler secret put BOARD_INGEST_SECRET
