name = "forkbill-board"
main = "src/index.ts"
compatibility_date = "2026-11-27"
routes = [{ pattern = "forkbill.prashantthakur.dev", custom_domain = true }]


# Build the board first: (cd ../web && VITE_BOARD_API=https://forkbill.prashantthakur.dev npm run build).
# The built board (board/web/dist) is served from the same origin as the API.
# API paths always reach the Worker; everything else is a static asset.
[assets]
directory = "../web/dist"
run_worker_first = ["/ingest", "/flagsmith/*", "/flags/*", "/state", "/stream"]

[vars]
# Comma-separated origins allowed to read /state and /stream.
ALLOWED_ORIGINS = "https://forkbill.prashantthakur.dev,http://localhost:5173,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "forkbill-board"
database_id = "ed068bc0-9653-4cd4-b078-36fe6802342b"
migrations_dir = "migrations"

# Secrets (not in this file): wrangler secret put BOARD_INGEST_SECRET
#                            wrangler secret put FLAGSMITH_WEBHOOK_SECRET  (the Flagsmith webhook's signing secret)
