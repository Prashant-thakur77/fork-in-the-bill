apiVersion: 1

datasources:
  - name: ClickHouse
    uid: fib-clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: ${CLICKHOUSE_USER}
      defaultDatabase: otel
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
