# Self-hosted Flagsmith with Experimentation turned on, for the kit portability demo.
#
# Based on the upstream repo-root docker-compose.yml (Flagsmith/flagsmith, main, Nov 2026), which
# runs experimentation on the Flagsmith Postgres database ("Flagsmith database" warehouse).
# SDK events go to the API itself: http://localhost:8000/api/v1/events/.
#
# Images are pinned by tag and digest. Values below marked "local only" are fine for a laptop demo
# and must be changed for any shared deployment; override them in selfhost/.env.

name: forkbill-selfhost

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: "true"
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: "*" # local only
  FLAGSMITH_DOMAIN: localhost:${FLAGSMITH_PORT:-8000}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-secret}
  WAREHOUSE_CREDENTIALS_SECRET: ${WAREHOUSE_CREDENTIALS_SECRET:-local-only-warehouse-secret}
  TASK_RUN_METHOD: TASK_PROCESSOR
  # Experimentation, storing SDK events in the Postgres database above (evaluation only).
  EXPERIMENTATION_ENABLED: "true"
  # Documented first-run initialisation: creates a superuser, an organisation and a project on
  # startup. The superuser has no password; bootstrap.sh sets one through the reset link.
  ALLOW_ADMIN_INITIATION_VIA_CLI: "true"
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@forkbill.local}
  ORGANISATION_NAME: ${ORGANISATION_NAME:-Fork in the Bill (self-hosted demo)}
  PROJECT_NAME: ${PROJECT_NAME:-forkbill-selfhost-demo}

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15.5-alpine@sha256:934be6ae0a5bce0f607a5edc437e6bd606c074e595c28d4897845d6502823104
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d flagsmith -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    command: ["migrate"]
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    restart: unless-stopped
    command: ["serve"]
    environment:
      <<: *flagsmith-env
    ports:
      - "127.0.0.1:${FLAGSMITH_PORT:-8000}:8000"
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.295.2@sha256:48905c664152d8ae2c843ec9cee72ff197e7caff6e91b959bb851a235915ea35
    restart: unless-stopped
    command: ["run-task-processor"]
    environment:
      <<: *flagsmith-env
    depends_on:
      migrate-db:
        condition: service_completed_successfully

networks:
  default:
    # An explicit subnet keeps the stack startable on hosts whose default address pools are used up.
    ipam:
      config:
        - subnet: ${SELFHOST_SUBNET:-10.213.0.0/24}
