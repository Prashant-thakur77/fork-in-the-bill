[project]
name = "fork-in-the-bill"
version = "0.1.0"
description = "A pre-registered Flagsmith experiment on coding-agent model routing, measured in dollars per solved task"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.14,<3",
  "flagsmith>=6.7,<7",
  "pydantic>=2.9",
  "docker>=7.1",
  "redis>=5.2",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "numpy>=2.1",
  "scipy>=1.14",
  "pyarrow>=18",
  "duckdb>=1.1",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "rich>=13.9",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
litellm = ["litellm>=1.55"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-recording>=0.13",
  "vcrpy>=6.0",
  "fakeredis[lua]>=2.26",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[project.scripts]
forkbill = "forkbill.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "runner", "integrity", "analysis", "tasks", "otel_setup", "kit/forkbill"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["forkbill", "harness", "runner", "integrity", "analysis", "tasks", "otel_setup"]

[tool.pyright]
include = ["harness", "runner", "integrity", "analysis", "tasks", "otel_setup", "kit/forkbill", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: needs a Docker daemon"]
pythonpath = [".", "kit"]
